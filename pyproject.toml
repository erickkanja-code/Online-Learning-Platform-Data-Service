[project]
name = "learning-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Erick Kanja",email = "e.kanja@alustudent.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pymongo (>=4.19.0,<5.0.0)"
]

[tool.poetry]
packages = [{include = "learning_platform", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
